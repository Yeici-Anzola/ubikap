<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ubikap | Continuar con teléfono</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>
<body class="relative flex min-h-screen flex-col bg-slate-900 text-slate-900">

  <!-- Fondo -->
  <div aria-hidden="true"
       class="fixed inset-0 pointer-events-none bg-[url('img/fondo.jpg')] bg-cover bg-center bg-no-repeat">
  </div>

  <!-- Encabezado -->
  <header class="relative z-10 flex items-start justify-between px-6 py-5 sm:px-14">
    <a href="/" aria-label="Ubikap, inicio">
      <img src="img/logo.png" class="h-16" alt="Ubikap" />
    </a>

    <a href="invitado.html"
       class="rounded-lg border border-slate-200/80 bg-indigo-950 px-4 py-2 text-sm text-white transition hover:bg-indigo-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-300">
      Ingresar como Invitado
    </a>
  </header>

  <!-- Tarjeta con Glassmorphism -->
  <main class="relative z-10 flex flex-1 items-center justify-center px-4 pb-10">
    <section class="w-full max-w-[473px] rounded-3xl border border-white/20 bg-white/10 px-8 py-10 shadow-2xl shadow-black/40 backdrop-blur-md sm:px-10"
             aria-labelledby="titulo">

      <!-- Indicador de pasos -->
      <ol class="mb-6 flex items-center justify-center gap-2" aria-label="Progreso">
        <li data-dot class="h-1.5 w-10 rounded-full bg-cyan-300 transition-colors"></li>
        <li data-dot class="h-1.5 w-10 rounded-full bg-white/25 transition-colors"></li>
        <li data-dot class="h-1.5 w-10 rounded-full bg-white/25 transition-colors"></li>
      </ol>

      <div class="text-center">
        <h1 id="titulo" class="bg-gradient-to-r from-violet-900 to-fuchsia-500 bg-clip-text text-6xl font-bold text-transparent">
          Ubikap
        </h1>
        <p id="subtitulo" class="mx-auto mt-3 max-w-xs text-base leading-relaxed text-white drop-shadow-md">
          Ingresa tu número de teléfono y te enviaremos un código.
        </p>
      </div>

      <!-- PASO 1: Teléfono -->
      <form id="paso-1" class="mt-8 space-y-4" novalidate>
        <div>
          <label for="telefono" class="mb-1 block text-sm font-semibold text-white drop-shadow-sm">Número de teléfono</label>
          <div class="flex gap-2">
            <select id="pais" aria-label="Código de país"
                    class="w-28 shrink-0 rounded-xl border border-white/10 bg-slate-900/40 px-3 py-3 text-white backdrop-blur-md focus:border-cyan-300 focus:outline-none focus:ring-2 focus:ring-cyan-300/50">
              <option class="text-slate-900" value="+57" selected>🇨🇴 +57</option>
              <option class="text-slate-900" value="+1">🇺🇸 +1</option>
              <option class="text-slate-900" value="+52">🇲🇽 +52</option>
              <option class="text-slate-900" value="+51">🇵🇪 +51</option>
              <option class="text-slate-900" value="+593">🇪🇨 +593</option>
              <option class="text-slate-900" value="+58">🇻🇪 +58</option>
              <option class="text-slate-900" value="+56">🇨🇱 +56</option>
              <option class="text-slate-900" value="+54">🇦🇷 +54</option>
              <option class="text-slate-900" value="+34">🇪🇸 +34</option>
            </select>
            <input id="telefono" type="tel" inputmode="tel" autocomplete="tel-national" maxlength="15"
                   placeholder="300 123 4567"
                   class="min-w-0 flex-1 rounded-xl border border-white/10 bg-slate-900/40 px-4 py-3 text-white placeholder-white/50 backdrop-blur-md transition focus:border-cyan-300 focus:outline-none focus:ring-2 focus:ring-cyan-300/50" />
          </div>
        </div>

        <p data-error role="alert" class="hidden rounded-lg border border-red-300/40 bg-red-500/20 px-3 py-2 text-sm text-red-100"></p>

        <button type="submit" data-submit
                class="w-full rounded-xl bg-gradient-to-r from-violet-700 to-fuchsia-600 px-4 py-3 font-semibold text-white shadow-lg shadow-fuchsia-900/30 transition hover:brightness-110 focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-300 disabled:opacity-60">
          Enviar código
        </button>
      </form>

      <!-- PASO 2: Código -->
      <form id="paso-2" class="mt-8 hidden space-y-4" novalidate>
        <div>
          <label for="c0" class="mb-2 block text-center text-sm font-semibold text-white drop-shadow-sm">Código de 6 dígitos</label>
          <div id="codigo" class="flex justify-center gap-2">
            <input id="c0" inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="Dígito 1" class="otp" />
            <input inputmode="numeric" maxlength="1" aria-label="Dígito 2" class="otp" />
            <input inputmode="numeric" maxlength="1" aria-label="Dígito 3" class="otp" />
            <input inputmode="numeric" maxlength="1" aria-label="Dígito 4" class="otp" />
            <input inputmode="numeric" maxlength="1" aria-label="Dígito 5" class="otp" />
            <input inputmode="numeric" maxlength="1" aria-label="Dígito 6" class="otp" />
          </div>
        </div>

        <p data-error role="alert" class="hidden rounded-lg border border-red-300/40 bg-red-500/20 px-3 py-2 text-sm text-red-100"></p>

        <button type="submit" data-submit
                class="w-full rounded-xl bg-gradient-to-r from-violet-700 to-fuchsia-600 px-4 py-3 font-semibold text-white shadow-lg shadow-fuchsia-900/30 transition hover:brightness-110 focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-300 disabled:opacity-60">
          Verificar código
        </button>

        <div class="flex items-center justify-between text-sm text-slate-200">
          <button type="button" id="cambiar-numero"
                  class="rounded font-semibold text-cyan-300 underline-offset-2 hover:underline focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-300">
            Cambiar número
          </button>
          <button type="button" id="reenviar" disabled
                  class="rounded font-semibold text-cyan-300 underline-offset-2 hover:underline focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-300 disabled:cursor-not-allowed disabled:text-white/50 disabled:no-underline">
            Reenviar código
          </button>
        </div>
      </form>

      <!-- PASO 3: Nombre -->
      <form id="paso-3" class="mt-8 hidden space-y-4" novalidate>
        <div>
          <label for="nombre" class="mb-1 block text-sm font-semibold text-white drop-shadow-sm">Nombre completo</label>
          <input id="nombre" type="text" autocomplete="name" placeholder="Tu nombre"
                 class="w-full rounded-xl border border-white/10 bg-slate-900/40 px-4 py-3 text-white placeholder-white/50 backdrop-blur-md transition focus:border-cyan-300 focus:outline-none focus:ring-2 focus:ring-cyan-300/50" />
        </div>

        <label class="flex items-start gap-3 text-sm text-slate-200">
          <input id="terminos" type="checkbox"
                 class="mt-0.5 h-4 w-4 shrink-0 rounded border-white/30 bg-slate-900/40 accent-fuchsia-500" />
          <span>Acepto los <a href="terminos.html" class="font-semibold text-cyan-300 underline-offset-2 hover:underline">términos y condiciones</a>.</span>
        </label>

        <p data-error role="alert" class="hidden rounded-lg border border-red-300/40 bg-red-500/20 px-3 py-2 text-sm text-red-100"></p>

        <button type="submit" data-submit
                class="w-full rounded-xl bg-gradient-to-r from-violet-700 to-fuchsia-600 px-4 py-3 font-semibold text-white shadow-lg shadow-fuchsia-900/30 transition hover:brightness-110 focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-300 disabled:opacity-60">
          Crear cuenta
        </button>
      </form>

      <p class="mt-8 text-center text-sm text-slate-200 drop-shadow-sm">
        <a href="login.html"
           class="rounded font-semibold text-cyan-300 underline-offset-2 hover:underline focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-300">
          Volver a otras opciones
        </a>
      </p>
    </section>
  </main>

  <style>
    /* Casillas del código: se definen aquí para no repetir clases seis veces */
    .otp {
      width: 2.75rem; height: 3.25rem; text-align: center; font-size: 1.25rem; color: #fff;
      border-radius: .75rem; border: 1px solid rgba(255,255,255,.1);
      background: rgba(15,23,42,.4); backdrop-filter: blur(12px);
    }
    .otp:focus { outline: none; border-color: #67e8f9; box-shadow: 0 0 0 2px rgba(103,232,249,.5); }
  </style>

  <script>
    const SEGUNDOS_REENVIO = 60;

    const forms = [1, 2, 3].map((n) => document.getElementById("paso-" + n));
    const dots = document.querySelectorAll("[data-dot]");
    const subtitulo = document.getElementById("subtitulo");
    const textos = [
      "Ingresa tu número de teléfono y te enviaremos un código.",
      "",
      "Último paso: dinos cómo quieres que te llamemos."
    ];

    let telefonoCompleto = "";
    let temporizador = null;

    function irAPaso(n) {
      forms.forEach((f, i) => f.classList.toggle("hidden", i !== n - 1));
      dots.forEach((d, i) => {
        d.classList.toggle("bg-cyan-300", i < n);
        d.classList.toggle("bg-white/25", i >= n);
      });
      subtitulo.textContent = n === 2 ? "Enviamos un código por SMS a " + telefonoCompleto + "." : textos[n - 1];
      limpiarErrores();
      const primero = forms[n - 1].querySelector("input");
      if (primero) primero.focus();
    }

    function limpiarErrores() {
      document.querySelectorAll("[data-error]").forEach((e) => e.classList.add("hidden"));
    }

    function mostrarError(form, msg) {
      const el = form.querySelector("[data-error]");
      el.textContent = msg;
      el.classList.remove("hidden");
    }

    async function post(url, cuerpo) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(cuerpo)
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.mensaje || "Ocurrió un error. Inténtalo de nuevo.");
      return data;
    }

    // Evita doble envío mientras se espera la respuesta
    async function conCarga(form, tarea) {
      const btn = form.querySelector("[data-submit]");
      btn.disabled = true;
      try { await tarea(); }
      catch (err) { mostrarError(form, err instanceof TypeError ? "No hay conexión con el servidor." : err.message); }
      finally { btn.disabled = false; }
    }

    // Cuenta regresiva para reenviar
    function iniciarTemporizador() {
      const btn = document.getElementById("reenviar");
      let restante = SEGUNDOS_REENVIO;
      clearInterval(temporizador);
      btn.disabled = true;
      btn.textContent = "Reenviar en " + restante + " s";
      temporizador = setInterval(() => {
        restante--;
        if (restante <= 0) {
          clearInterval(temporizador);
          btn.disabled = false;
          btn.textContent = "Reenviar código";
        } else {
          btn.textContent = "Reenviar en " + restante + " s";
        }
      }, 1000);
    }

    // ---------- Paso 1: enviar código ----------
    async function enviarCodigo(form) {
      const pais = document.getElementById("pais").value;
      const numero = document.getElementById("telefono").value.replace(/\D/g, "");
      if (numero.length < 7 || numero.length > 12) return mostrarError(form, "Escribe un número de teléfono válido.");
      telefonoCompleto = pais + numero;
      await post("/api/telefono/enviar-codigo", { telefono: telefonoCompleto });
      irAPaso(2);
      iniciarTemporizador();
    }

    forms[0].addEventListener("submit", (e) => {
      e.preventDefault();
      limpiarErrores();
      conCarga(forms[0], () => enviarCodigo(forms[0]));
    });

    // ---------- Paso 2: verificar código ----------
    const otp = [...document.querySelectorAll(".otp")];

    otp.forEach((input, i) => {
      input.addEventListener("input", () => {
        input.value = input.value.replace(/\D/g, "").slice(0, 1);
        if (input.value && i < otp.length - 1) otp[i + 1].focus();
      });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !input.value && i > 0) otp[i - 1].focus();
      });
      input.addEventListener("paste", (e) => {
        const texto = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, otp.length);
        if (!texto) return;
        e.preventDefault();
        [...texto].forEach((d, k) => { otp[k].value = d; });
        otp[Math.min(texto.length, otp.length - 1)].focus();
      });
    });

    forms[1].addEventListener("submit", (e) => {
      e.preventDefault();
      limpiarErrores();
      const codigo = otp.map((o) => o.value).join("");
      if (codigo.length < 6) return mostrarError(forms[1], "Escribe los 6 dígitos del código.");

      conCarga(forms[1], async () => {
        const r = await post("/api/telefono/verificar-codigo", { telefono: telefonoCompleto, codigo });
        // Si el teléfono ya tenía cuenta, entra directo; si no, pide el nombre
        if (r.nuevo === false) window.location.href = "inicio.html";
        else irAPaso(3);
      });
    });

    document.getElementById("reenviar").addEventListener("click", () => {
      limpiarErrores();
      conCarga(forms[1], async () => {
        await post("/api/telefono/enviar-codigo", { telefono: telefonoCompleto });
        otp.forEach((o) => { o.value = ""; });
        otp[0].focus();
        iniciarTemporizador();
      });
    });

    document.getElementById("cambiar-numero").addEventListener("click", () => {
      clearInterval(temporizador);
      otp.forEach((o) => { o.value = ""; });
      irAPaso(1);
    });

    // ---------- Paso 3: crear cuenta ----------
    forms[2].addEventListener("submit", (e) => {
      e.preventDefault();
      limpiarErrores();
      const nombre = document.getElementById("nombre").value.trim();
      if (nombre.length < 2) return mostrarError(forms[2], "Escribe tu nombre completo.");
      if (!document.getElementById("terminos").checked) return mostrarError(forms[2], "Debes aceptar los términos y condiciones.");

      conCarga(forms[2], async () => {
        await post("/api/telefono/crear-cuenta", { telefono: telefonoCompleto, nombre });
        window.location.href = "inicio.html";
      });
    });
  </script>
</body>
</html>
